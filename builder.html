<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Survey Builder</title>
  <link rel="stylesheet" href="platform.css?v=1" />
  <!-- <link rel="stylesheet" href="modern-ui.css?v=4"> -->
  <style>
:root{--accent:#2f6f5e;--accent-soft:#eaf3ef;--bg:#f3f6f3;--surface:#fff;--border:#d8e0da;--text:#17231c;--muted:#6a766f;--danger:#a23333;--shadow:0 10px 30px rgba(25,45,34,.08);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"Noto Sans",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:20;min-height:64px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:white;font-size:12px}.status-pill{padding:4px 8px;border-radius:999px;background:#eef2ef;color:var(--muted);font-size:11px;font-weight:700}.status-pill.published{background:#e5f4ea;color:#24623c}.top-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.top-actions button,.btn{min-height:40px;padding:8px 13px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-weight:700}.top-actions .primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.builder-layout{display:grid;grid-template-columns:240px minmax(360px,1fr) 340px;min-height:calc(100vh - 64px)}.palette-panel,.inspector-panel{background:#fff}.palette-panel{border-right:1px solid var(--border);padding:16px;overflow:auto;max-height:calc(100vh - 64px);position:sticky;top:64px}.inspector-panel{border-left:1px solid var(--border);padding:18px;overflow:auto;max-height:calc(100vh - 64px);position:sticky;top:64px}.panel-heading{font-weight:800;font-size:16px;margin-bottom:14px}.group-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 7px}.question-type-grid{display:grid;gap:7px}.qtype-btn{width:100%;display:flex;align-items:center;gap:9px;text-align:left;min-height:44px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text)}.qtype-btn:hover,.qtype-btn:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}.qtype-icon{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:900;flex:none}.canvas-panel{min-width:0;padding:22px}.survey-header-card,.question-card,.empty-state{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}.survey-header-card{padding:18px;display:grid;gap:13px;margin-bottom:14px}.survey-header-card label,.field{display:grid;gap:6px;font-size:12px;font-weight:750;color:var(--muted)}input,textarea,select{width:100%;border:1px solid #ccd6cf;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);font-size:15px}input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)}textarea{resize:vertical}.question-canvas{display:grid;gap:10px}.empty-state{padding:30px;text-align:center;color:var(--muted)}.question-card{padding:15px;cursor:pointer}.question-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,transparent),var(--shadow)}.question-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.question-type{font-size:11px;font-weight:800;color:var(--accent)}.question-actions{display:flex;gap:5px}.icon-btn{width:34px;height:34px;border:1px solid var(--border);border-radius:9px;background:#fff}.icon-btn.danger{color:var(--danger)}.question-title{font-size:17px;font-weight:750}.question-preview{color:var(--muted);font-size:13px;margin-top:4px}.inspector-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.inspector-title h2{font-size:17px;margin:0}.section{padding:14px 0;border-top:1px solid var(--border);display:grid;gap:11px}.section:first-of-type{border-top:0;padding-top:0}.section h3{font-size:12px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}.check input{width:auto;margin-top:3px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice-row{display:grid;grid-template-columns:1fr 38px;gap:7px;margin-bottom:7px}.small-help{font-size:12px;line-height:1.45;color:var(--muted)}.language-chip-row{display:flex;flex-wrap:wrap;gap:6px}.language-chip{padding:5px 8px;border-radius:999px;background:var(--accent-soft);font-size:12px}.translation-block{border:1px solid var(--border);border-radius:10px;padding:9px}.translation-block summary{cursor:pointer;font-weight:750}.save-state{font-size:12px;color:var(--muted);min-height:18px}.hidden{display:none!important}
@media(max-width:1050px){.builder-layout{grid-template-columns:210px minmax(0,1fr)}.inspector-panel{position:fixed;right:0;top:64px;bottom:0;width:min(380px,92vw);max-height:none;z-index:30;box-shadow:-10px 0 30px rgba(20,40,30,.15);transform:translateX(100%);transition:transform .18s ease}.inspector-panel.open{transform:translateX(0)}}
@media(max-width:720px){.topbar{position:relative;align-items:flex-start;flex-direction:column}.top-actions{width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.top-actions button{white-space:nowrap}.builder-layout{display:block}.palette-panel{position:relative;top:auto;max-height:none;border-right:0;border-bottom:1px solid var(--border)}#palette{display:grid;grid-template-columns:1fr 1fr;gap:10px}.group-block{min-width:0}.qtype-btn{min-height:48px}.canvas-panel{padding:12px}.inspector-panel{top:0;width:100vw}.row{grid-template-columns:1fr}.question-card{scroll-margin-top:10px}}
@media(max-width:430px){#palette{grid-template-columns:1fr}.brand strong{font-size:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">SB</span><strong>Survey Builder</strong><span id="statusPill" class="status-pill">Draft</span></div>
    <div class="top-actions">
      <button id="settingsBtn" type="button">Survey settings</button>
      <button id="previewBtn" type="button">Preview</button>
      <button id="adminBtn" type="button">Dashboard</button>
      <button id="saveBtn" type="button">Save draft</button>
      <button id="publishBtn" class="primary" type="button">Publish</button>
    </div>
  </header>

  <main class="builder-layout">
    <aside class="palette-panel">
      <div class="panel-heading">Add questions</div>
      <div id="palette"></div>
    </aside>

    <section class="canvas-panel">
      <div class="survey-header-card">
        <label>Survey title<input id="surveyTitle" type="text" value="Untitled survey" /></label>
        <label>Introduction<textarea id="surveyDescription" rows="3" placeholder="Add a short introduction for respondents"></textarea></label>
      </div>
      <div id="questionCanvas" class="question-canvas"></div>
    </section>

    <aside id="inspector" class="inspector-panel" aria-live="polite"></aside>
  </main>

  <script src="builder.js?v=1"></script>
</body>
</html>
